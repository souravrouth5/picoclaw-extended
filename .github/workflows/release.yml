name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.23'

      - name: Generate embedded assets
        run: cp -r workspace cmd/picoclaw/internal/onboard/workspace

      - name: Build all platforms
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          GIT_COMMIT=$(git rev-parse --short=8 HEAD 2>/dev/null || echo "dev")
          BUILD_TIME=$(date +%FT%T%z)
          GO_VERSION=$(go version | awk '{print $3}')
          PKG="github.com/sipeed/picoclaw/pkg/config"
          LDFLAGS="-X ${PKG}.Version=${VERSION} -X ${PKG}.GitCommit=${GIT_COMMIT} -X ${PKG}.BuildTime=${BUILD_TIME} -X ${PKG}.GoVersion=${GO_VERSION} -s -w"

          # WhatsApp native (modernc.org/libc supported platforms)
          GOOS=linux   GOARCH=amd64          CGO_ENABLED=0 go build -tags whatsapp_native -ldflags "$LDFLAGS" -o build/picoclaw-linux-amd64          ./cmd/picoclaw
          GOOS=linux   GOARCH=arm64          CGO_ENABLED=0 go build -tags whatsapp_native -ldflags "$LDFLAGS" -o build/picoclaw-linux-arm64          ./cmd/picoclaw
          GOOS=linux   GOARCH=arm  GOARM=7   CGO_ENABLED=0 go build -tags whatsapp_native -ldflags "$LDFLAGS" -o build/picoclaw-linux-arm            ./cmd/picoclaw
          GOOS=darwin  GOARCH=arm64          CGO_ENABLED=0 go build -tags whatsapp_native -ldflags "$LDFLAGS" -o build/picoclaw-darwin-arm64         ./cmd/picoclaw
          GOOS=windows GOARCH=amd64          CGO_ENABLED=0 go build -tags whatsapp_native -ldflags "$LDFLAGS" -o build/picoclaw-windows-amd64.exe    ./cmd/picoclaw

          # No WhatsApp native (unsupported by modernc.org/libc)
          GOOS=linux GOARCH=loong64                        CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o build/picoclaw-linux-loong64  ./cmd/picoclaw
          GOOS=linux GOARCH=riscv64                        CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o build/picoclaw-linux-riscv64  ./cmd/picoclaw
          GOOS=linux GOARCH=mipsle  GOMIPS=softfloat       CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o build/picoclaw-linux-mipsle   ./cmd/picoclaw

      - name: Create release archives
        run: |
          cd build
          for f in picoclaw-*; do
            [[ "$f" == *.tar.gz ]] && continue
            if [[ "$f" == *.exe ]]; then
              zip "${f%.exe}.zip" "$f"
            else
              tar czf "${f}.tar.gz" "$f"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/*.tar.gz,build/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
